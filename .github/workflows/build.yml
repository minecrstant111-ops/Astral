name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ./*.zip
      - run: sed -i 's/^import dev.astral.\*;/import dev.astral.*;\nimport dev.astral.Module;/' astral/src/main/java/dev/astral/gui/ClickGui.java
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.12 }
      - run: gradle build
        working-directory: astral
      - uses: actions/upload-artifact@v4
        with: { name: astral-jar, path: astral/build/libs/*.jar }
